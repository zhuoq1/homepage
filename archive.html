<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Archive of all posts on Zhuoqi Fu's Blog.">
  <title>Archive — Zhuoqi's Blog</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a href="/" class="nav-brand">Zhuoqi's Blog</a>
      <ul class="nav-links">
        <li><a href="/">Posts</a></li>
        <li><a href="archive.html" class="active">Archive</a></li>
        <li><a href="https://github.com/zhuoq1" target="_blank" rel="noopener noreferrer">GitHub</a></li>
        <li><a href="https://www.linkedin.com/in/zhuoqi/" target="_blank" rel="noopener noreferrer">LinkedIn</a></li>
      </ul>
    </div>
  </nav>

  <main class="main">
    <h1 style="font-size:1.6rem;font-weight:700;margin-bottom:0.5rem;">Archive</h1>
    <p style="color:var(--color-muted);margin-bottom:1.5rem;">All posts, sorted by date.</p>

    <div id="archive-container">
      <p class="loading-placeholder">Loading archive...</p>
    </div>
  </main>

  <footer class="footer">
    <p>
      © <span id="year"></span> Zhuoqi Fu
      <span class="footer-sep">·</span>
      Built with plain HTML & CSS
      <span class="footer-sep">·</span>
      <a href="#">Back to top ↑</a>
    </p>
  </footer>

  <script src="lib/marked.min.js"></script>
  <script src="lib/purify.min.js"></script>
  <script src="blog.js"></script>
  <script src="script.js"></script>
  <script>
    (async function initArchive() {
      const container = document.getElementById('archive-container');
      try {
        const posts = await fetchManifest();
        renderArchive(container, posts);
      } catch (err) {
        container.innerHTML = '<p class="error">Failed to load archive. Please refresh the page.</p>';
        console.error(err);
      }
    })();
  </script>
</body>
</html>
